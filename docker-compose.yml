version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    # Optional: map volume for hot-reloading (uncomment if you want live changes)
    # volumes:
    #   - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: 
      context: ./frontend
    ports:
      - "5173:5173"
    # Optional: map volume for hot-reloading
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    depends_on:
      - backend
